[project]
name = "evoflow-listener"
version = "0.1.2"
description = ""
authors = [
    { name = "graziano", email = "myemail@mysite.com" }
]
readme = "README.md"
requires-python = "^3.12"

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
paho-mqtt = ">=2.1.0,<3.0.0"
sqlalchemy = ">=2.0.30,<3.0.0"
psycopg2-binary = ">=2.9.9,<3.0.0"
evoflow_db = { git = "git@github.com:Schwank-Lab/evoflow-monitor.git", branch = "main", subdirectory = "evohub/evoflow_db" }
evoflow_utils = { git = "git@github.com:Schwank-Lab/evoflow-monitor.git", branch = "main", subdirectory = "evohub/evoflow_utils" }

[tool.poetry.scripts]
listen = "evoflow_listener.mqtt_listener:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"