[tool.poetry]
name = "evoflow-listener"
version = "0.1.0"
description = ""
authors = ["graziano <myemail@mysite.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
paho-mqtt = "^2.1.0"
sqlalchemy = "^2.0.30"
psycopg2-binary = "^2.9.9"
evoflow_db = { git = "git@github.com:Schwank-Lab/evoflow-monitor.git", branch = "deploy", subdirectory = "evohub/evoflow_db" }
evoflow_utils = { git = "git@github.com:Schwank-Lab/evoflow-monitor.git", branch = "deploy", subdirectory = "evohub/evoflow_utils" }

[tool.poetry.scripts]
listen = "evoflow_listener.mqtt_listener:main"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
