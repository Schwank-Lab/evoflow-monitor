[project]
name = "evoflow-ui"
version = "1.1.3"
description = ""
authors = [
    { name = "graziano", email = "myemail@mysite.com" }
]
readme = "README.md"
requires-python = ">=3.11,<4.0"

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
dash = ">=2.16.1,<3.0.0"
paho-mqtt = ">=2.1.0,<3.0.0"
dash-bootstrap-components = ">=1.6.0,<2.0.0"
psycopg2-binary = ">=2.9.9,<3.0.0"
pandas = ">=2.2.2,<3.0.0"
pytest = ">=8.3.2,<9.0.0"
evoflow_db = { git = "https://github.com/Schwank-Lab/evoflow-monitor.git", branch = "main", subdirectory = "evohub/evoflow_db" }
evoflow_utils = { git = "https://github.com/Schwank-Lab/evoflow-monitor.git", branch = "main", subdirectory = "evohub/evoflow_utils" }

[tool.poetry.scripts]
app = "evoflow_ui.main:main"

[tool.poetry]
requires-poetry = ">=2.0.0,<3.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"