version: '3.8'

services:
  minio:
    image: quay.io/minio/minio:latest
    volumes:
      - minio_data:/data
    ports:
      - 9000:9000
      - 9002:9001
    restart: always
    environment:
      MINIO_ROOT_USER: 'admin'
      MINIO_ROOT_PASSWORD: 'hungryphage'
      MINIO_ADDRESS: ':9000'
      MINIO_CONSOLE_ADDRESS: ':9001'
    command: minio server /data

volumes:
  minio_data:  