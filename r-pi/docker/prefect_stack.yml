version: "3.8"

services:
  prefect_server:
    image: prefecthq/prefect:2-latest
    hostname: prefect_server
    restart: always
      #command: prefect server start
    entrypoint: ["prefect", "server", "start"]
    ports:
      - 4200:4200
    volumes:
      - prefect:/root/.prefect
      - prefect:/flows
    environment:
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_DATABASE_CONNECTION_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/prefect

  agent:
    image: prefecthq/prefect:2-latest
    restart: always
    #entrypoint: ["/opt/prefect/entrypoint.sh", "prefect", "worker", "start", "-pool", "'evohub'"]
    entrypoint: ["prefect", "worker", "start", "--pool", "'evohub'"]
    environment:
      - PREFECT_API_URL=http://prefect_server:4200/api

volumes:
  prefect:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/evohub/data/prefect
  
networks:
  default:
    name: monitor_default
    external: true

