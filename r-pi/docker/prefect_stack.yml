version: '3.8'

services:
  prefect_server:
    image: prefecthq/prefect:2-latest
    hostname: prefect_server
    restart: always
    command: prefect server start
    ports:
      - 4200:4200
    volumes:
      - prefect_data:/root/.prefect
      - prefect_flows:/flows
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      AWS_ACCESS_KEY_ID: 75igVmmMH0n6uSq0CHjn
      AWS_SECRET_ACCESS_KEY: pnlV6exeMwHteBl50B5CfQmjd22YBwuk6YK8IvOK

  prefect_agent:
    image: prefect_agent:latest
    command: prefect agent start -p "idec"
    restart: always
    environment:
        PREFECT_API_URL: "http://10.66.4.6:4200/api" # this is the server lab ip
        AWS_ACCESS_KEY_ID: 75igVmmMH0n6uSq0CHjn # this have been created from minio
        AWS_SECRET_ACCESS_KEY: pnlV6exeMwHteBl50B5CfQmjd22YBwuk6YK8IvOK #same 

volumes:
  prefect_data:
  prefect_flows:       