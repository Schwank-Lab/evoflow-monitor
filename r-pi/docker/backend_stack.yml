version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto
    hostname: mosquitto
    container_name: mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto:/mosquitto/config:rw
      - mosquitto:/mosquitto/data:rw
      - mosquitto:/mosquitto/log:rw
    networks:
      - evohub_net
      
  postgres:
    image: postgres:latest
    hostname: postgres
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: evohub
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: veryhungryphage
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - evohub_net

  grafana:
    image: grafana/grafana:latest
    hostname: grafana
    container_name: grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: veryhungryphage
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: veryhungryphage
    volumes:
      - grafana:/var/lib/grafana
    networks:
      - evohub_net
      
volumes:
  mosquitto:
  postgres:
  grafana:

networks:
  evohub_net:
    driver: bridge
