version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto
    hostname: mosquitto
    container_name: mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto:/mosquitto/config:rw
      - mosquitto:/mosquitto/data:rw
      - mosquitto:/mosquitto/log:rw
      
  postgres:
    image: postgres:latest
    hostname: postgres
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  grafana:
    image: grafana/grafana:latest
    hostname: grafana
    container_name: grafana
    restart: always
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: True
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: veryhungryphage
    ports:
      - "3000:3000"
    volumes:
      - grafana:/var/lib/grafana
    
volumes:
  mosquitto:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/evohub/data/mosquitto
  postgres:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/evohub/data/postgres
  grafana: