---
- hosts: all
  become: yes
  tasks:
    - name: Ensure git is installed
      ansible.builtin.package:
        name: git
        state: present

    - name: Create Workspace
      ansible.builtin.file:
        path: "/home/{{ ansible_user}}/Workspace"
        state: directory        
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Clone GitHub repository
      become_user: "{{ ansible_user }}"
      ansible.builtin.git:
        repo: "git@github.com:Schwank-Lab/evoflow-monitor.git"
        dest: "/home/{{ ansible_user }}/Workspace"
        version: 'main'  
        update: yes
        accept_hostkey: yes
        key_file: "/home/{{ ansible_user }}/.ssh/idec_github"