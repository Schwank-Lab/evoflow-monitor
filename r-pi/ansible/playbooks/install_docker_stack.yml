---
- name: USB Mount If Available
  hosts: pi
  become: false
  vars:
    mount_point: "/home/{{ ansible_user }}/data"
    stack_location: "/home/{{ ansible_user }}/Workspace/r-pi/docker"

  tasks:
    - name: Check if mount point directory exists
      stat:
        path: "{{ mount_point }}"
      register: mount_point_dir

    - name: Create mount point directory
      file:
        path: "{{ mount_point }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
      when: mount_point_dir.stat.exists == False

    - name: Check if any USB stick is connected
      shell: lsblk -o NAME,TRAN | grep usb
      register: usb_check
      failed_when: usb_check.rc not in [0, 1]
      ignore_errors: yes

    - name: Debug USB check output
      debug:
        msg: "{{ usb_check.stdout }}"

    - name: Set USB device variable
      set_fact:
        usb_device: "{{ usb_check.stdout_lines[0].split()[0] }}"
      when: usb_check.rc == 0

    - name: Find USB partition
      command: lsblk -nr -o NAME /dev/{{ usb_device }}
      register: usb_partition
      when: usb_check.rc == 0

    - name: Set USB partition variable
      set_fact:
        usb_partition_device: "/dev/{{ usb_partition.stdout_lines[1] }}"
      when: usb_partition.stdout_lines | length > 1

    - name: Debug USB partition
      debug:
        msg: "{{ usb_partition_device }}"

    - name: Mount the USB stick
      become: true
      block:
        - name: Get UUID of the USB device
          shell: blkid -s UUID -o value {{ usb_partition_device }}
          register: usb_uuid

        - name: Debug USB UUID
          debug:
            msg: "UUID: {{ usb_uuid.stdout }}"

        - name: Add entry to /etc/fstab
          lineinfile:
            path: /etc/fstab
            line: "UUID={{ usb_uuid.stdout }} {{ mount_point }} auto defaults,noatime,uid={{ ansible_user }},gid={{ ansible_user }} 0 2"
            state: present
        
        - name: Mount USB from fstab
          become: true
          shell: mount -a 
      when: usb_check.rc == 0

    - name: Notify no USB found
      debug:
        msg: "No USB device found. The directory {{ mount_point }} has been created."
      when: usb_check.rc != 0

    - name: Creating folder structure for docker
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
      loop:
        - "{{ mount_point }}/mosquitto"
        - "{{ mount_point }}/postgres"
        - "{{ mount_point }}/grafana"

    - name: Install backend
      command: docker compose -f "{{ stack_location }}/portainer_stack.yml" up -d
