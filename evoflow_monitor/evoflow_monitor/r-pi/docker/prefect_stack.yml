version: "3.8"

services:
  prefect_server:
    image: prefecthq/prefect:2-latest
    hostname: prefect_server
    restart: always
    command: prefect server start
    ports:
      - 4200:4200
    volumes:
      - prefect_data:/root/.prefect
      - prefect_flows:/flows
    environment:
      - PREFECT_SERVER_API_HOST=0.0.0.0

  prefect_agent:
    image: prefecthq/prefect:2-latest
    privileged: true # forced for Docker DinD
    # entrypoint: ["/bin/sh", "-c"]
    command: prefect worker start
    environment:
      PREFECT_API_URL: "http://0.0.0.0:4200/api"
    # volumes:
    #   - type: bind
    #     source: /var/run/docker.sock
    #     target: /var/run/docker.sock
    #     read_only: true
        
volumes:
  prefect_data:
  prefect_flows:
  
networks:
  default:
    name: monitor_stack_default
    external: true